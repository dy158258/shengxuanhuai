<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>盛宣怀的客厅</title>
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <div class="app">
    <div class="phone">
      <!-- 顶栏 -->
      <header class="chat-header">
        <div class="hdr-avatar" id="hdr-avatar" title="你"></div>
        <div class="hdr-title">
          <div class="hdr-name" id="hdr-name">盛宣怀的客厅</div>
          <div class="hdr-sub" id="hdr-sub">三厂合并 · 1898—1908</div>
        </div>
        <button class="hdr-btn" id="hdr-more" title="菜单">⋯</button>
      </header>

      <!-- 消息区 -->
      <main class="chat-body" id="chat-body"></main>

      <!-- 轻触提示 -->
      <div class="tap-hint" id="tap-hint" hidden>轻触屏幕继续 ▾</div>

      <!-- 底部操作区 -->
      <footer class="chat-footer" id="chat-footer"></footer>

      <!-- 剧情沉浸自动播放开关 -->
      <button id="imm-auto" class="imm-auto" hidden>自动 ▸</button>
    </div>
  </div>

  <!-- 封面 -->
  <div id="select" class="fullscreen cover">
    <div class="cover-inner">
      <img class="cover-title-img" src="img/title.jpg" alt="盛宣怀的客厅" />
      <img class="cover-chair-img" src="img/chair.jpg" alt="木椅" />
      <div class="cover-actions">
        <button class="btn-enter" id="select-confirm">进入游戏</button>
      </div>
    </div>
  </div>

  <!-- 目录 -->
  <div id="catalog" class="fullscreen catalog" hidden>
    <div class="catalog-scroll">
      <div class="catalog-roller catalog-roller-top"></div>
      <div class="catalog-paper">
        <div class="catalog-head">
          <div class="catalog-title">盛宣怀的客厅</div>
          <div class="catalog-sub">三厂合并 · 1898—1908</div>
        </div>
        <div id="catalog-resume" class="catalog-resume"></div>
        <div class="catalog-list" id="catalog-list"></div>
        <div class="catalog-foot">· 展卷 ·</div>
      </div>
      <div class="catalog-roller catalog-roller-bottom"></div>
    </div>
    <button class="catalog-back" id="catalog-back">‹ 返回封面</button>
  </div>

  <!-- 片头卷轴 -->
  <div id="intro" class="fullscreen intro" hidden>
    <div class="scroll">
      <div class="scroll-roller scroll-roller-top"></div>
      <div class="scroll-paper">
        <div class="scroll-title">盛宣怀的客厅</div>
        <div class="scroll-sub">三厂合并 · 1898—1908</div>
        <div class="scroll-text" id="scroll-text"></div>
      </div>
      <div class="scroll-roller scroll-roller-bottom"></div>
    </div>
    <div class="intro-actions">
      <button class="btn btn-primary" id="intro-skip">进入序幕 →</button>
    </div>
  </div>

  <!-- 结局 / 失败 全屏 -->
  <div id="outcome" class="fullscreen outcome" hidden>
    <div class="outcome-inner">
      <div class="outcome-stamp" id="outcome-stamp">败</div>
      <div class="outcome-kind" id="outcome-kind">临时结局</div>
      <h2 class="outcome-title" id="outcome-title"></h2>
      <div class="outcome-body" id="outcome-body"></div>
      <div class="outcome-actions" id="outcome-actions"></div>
    </div>
  </div>

  <!-- 菜单（底部抽屉） -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-mask" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-title">菜单</div>
      <div class="sheet-list" id="sheet-list"></div>
      <button class="sheet-cancel" data-close>取消</button>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions"><button class="btn btn-ghost" data-close>关闭</button></div>
    </div>
  </div>

  <script src="lib/mermaid.min.js"></script>
  <script src="script.js?v=9"></script>
</body>
</html>
